image: python:3.11-slim

stages:
  - quality

variables:
  UV_CACHE_DIR: .uv-cache

cache:
  paths:
    - .uv-cache/

quality:
  stage: quality
  before_script:
    - python -m pip install --disable-pip-version-check uv==0.12.5
    - uv sync --extra dev --locked
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest --cov=pricing_canasta --cov-report=term-missing --cov-report=xml
    - uv export --quiet --no-dev --locked --no-emit-project --no-hashes --output-file requirements-audit.txt
    - uvx --from pip-audit==2.10.1 pip-audit --strict --no-deps --disable-pip --requirement requirements-audit.txt
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
