name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --extra dev --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Tests and coverage
        run: >-
          uv run pytest
          --cov=pricing_canasta
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Dependency audit
        run: |
          uv export --no-dev --locked --no-emit-project --output-file requirements-audit.txt
          uvx --from pip-audit==2.10.1 pip-audit --strict --requirement requirements-audit.txt

      - name: Validate local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "./**/*.md"
          fail: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
